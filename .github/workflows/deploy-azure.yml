name: Deploy to Azure

# Builds and deploys the site to the Static Web App created by infra/main.bicep.
# Needs the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret (see
# docs/deployment-azure.md); without it the job skips instead of failing.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - name: Skip when no deployment token is configured
        if: env.HAS_DEPLOY_TOKEN != 'true'
        run: echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set; skipping deployment."

      - uses: actions/checkout@v7
        if: env.HAS_DEPLOY_TOKEN == 'true'

      - name: Build and deploy
        if: env.HAS_DEPLOY_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: dist
