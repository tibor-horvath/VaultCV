name: CI

# Built on the reusable workflows in tibor-horvath/ci-toolkit (pinned to the
# moving `@v1` tag). Web and API run as separate jobs, and a newer push to a PR
# cancels the run in flight.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web
    uses: tibor-horvath/ci-toolkit/.github/workflows/node-build-test.yml@v1
    with:
      working-directory: web
      # `build` already runs `tsc -b`, so there is no separate typecheck script.
      typecheck-script: ""
      # Lint has pre-existing issues in the admin routes (see AGENTS.md).
      # Set this to "lint" once they are fixed.
      lint-script: ""
      build-artifact-name: web-dist
    permissions:
      contents: read

  api:
    name: API
    uses: tibor-horvath/ci-toolkit/.github/workflows/node-build-test.yml@v1
    with:
      working-directory: api
      typecheck-script: ""
      lint-script: ""
      build-artifact-name: api-dist
    permissions:
      contents: read

  secret-scan:
    name: Secrets
    uses: tibor-horvath/ci-toolkit/.github/workflows/secret-scan.yml@v1
    permissions:
      contents: read
