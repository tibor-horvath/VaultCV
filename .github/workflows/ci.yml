name: CI

# Built on the reusable workflows in tibor-horvath/ci-toolkit (pinned to the
# moving `@v2` tag). Web and API run as separate jobs, and a newer push to a PR
# cancels the run in flight.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web:
    name: Web
    uses: tibor-horvath/ci-toolkit/.github/workflows/node-build-test.yml@v2
    with:
      working-directory: web
      # Repo-root .nvmrc (Node 24). Resolved relative to working-directory.
      node-version-file: ../.nvmrc
      # `build` already runs `tsc -b`, so there is no separate typecheck script.
      typecheck-script: ""
      # Lint has pre-existing issues in the admin routes (see AGENTS.md).
      # Set this to "lint" once they are fixed.
      lint-script: ""
      build-artifact-name: web-dist
    permissions:
      contents: read

  api:
    name: API
    uses: tibor-horvath/ci-toolkit/.github/workflows/node-build-test.yml@v2
    with:
      working-directory: api
      # api/.nvmrc (Node 22): must match `apiRuntime` in staticwebapp.config.json,
      # since Static Web Apps managed functions run Node 22 at most.
      node-version-file: .nvmrc
      typecheck-script: ""
      lint-script: ""
      build-artifact-name: api-dist
    permissions:
      contents: read

  infra:
    name: Infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  secret-scan:
    name: Secrets
    uses: tibor-horvath/ci-toolkit/.github/workflows/secret-scan.yml@v2
    permissions:
      contents: read
